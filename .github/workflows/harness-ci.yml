name: Harness CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: false
      - name: Go checks
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      - name: Dashboard projection and syntax
        run: |
          node scripts/check-dashboard-model.mjs
          node --input-type=module --check < internal/dashboard/assets/app.js
          node --input-type=module --check < internal/dashboard/assets/model.js
          node --check scripts/check-dashboard.mjs
      - name: Recorded contract provenance
        run: |
          python3 internal/domain/testdata/capture.py --output "$RUNNER_TEMP/contracts"
          for fixture in internal/domain/testdata/*.json; do
            diff -u "$fixture" "$RUNNER_TEMP/contracts/$(basename "$fixture")"
          done
      - name: GitHub reader parity
        run: python3 internal/ghgateway/testdata/parity.py
      - name: Python tests
        run: python3 -m unittest discover -s .ai-team/tests -p 'test_*.py'
      - name: Secret and provider boundaries
        run: |
          bash .ai-team/tests/secret-boundary.sh
          bash .ai-team/tests/codex-private-home.sh
          bash .ai-team/tests/coordinator-cycle-claude-args.sh
      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -q '^#!/usr/bin/env bash'; then
              bash -n "$file"
            fi
          done < <(find .ai-team/bin .ai-team/hooks .ai-team/tests -type f -print0)
